name: vuln

# A vulnerability in a dependency is published when it is published, not when we
# happen to push. This runs govulncheck against main on a schedule and reports
# findings as an issue.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_TITLE: "govulncheck: vulnerabilities reported on main"
      ISSUE_LABEL: area:security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache-dependency-path: go.mod

      - name: govulncheck
        id: scan
        run: |
          if make govulncheck >vuln.txt 2>&1; then
            echo "clean=true" >>"$GITHUB_OUTPUT"
          else
            echo "clean=false" >>"$GITHUB_OUTPUT"
          fi
          cat vuln.txt

      - name: report findings
        if: steps.scan.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "govulncheck reported findings against main."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            cat vuln.txt
            echo '```'
          } >body.md
          # Match on the exact title rather than the search index, which lags
          # behind by minutes and would open a second issue.
          existing=$(gh issue list --state open --label "$ISSUE_LABEL" \
            --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md \
              --label "$ISSUE_LABEL" --label type:infra
          fi
          exit 1
