name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch. Superseded pull request runs are cancelled; runs on main
# are left to finish so every commit there keeps a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: "0"
  GOFLAGS: -mod=readonly
  # No implicit toolchain downloads: the Go version below builds everything.
  GOTOOLCHAIN: local

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          # The module has no dependencies yet, so go.mod is the cache key. What
          # the cache is really holding is the build cache for the pinned tools.
          cache-dependency-path: go.mod

      # Each gate is its own step so a red run names the gate that failed. The
      # steps are the targets of `make ci`, which is the local equivalent.
      - name: gofumpt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: staticcheck
        run: make staticcheck

      - name: gosec
        run: make gosec

      - name: govulncheck
        run: make govulncheck

      - name: go.mod and go.sum are tidy
        run: make tidy-check

      # -race needs cgo, so this step alone builds with a C toolchain. The
      # shipped binary is proven cgo free in the cross-build job.
      # The example sensors (issue #14, M3-07) are shell, so shellcheck is
      # not a Makefile pin like the Go tools: it is a system package. Install
      # it here so `make sensors-examples` runs the full gate. The step is its
      # own gate so a red example names the exact script that failed.
      - name: install shellcheck for the example sensors
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: example sensors parse, lint and behave
        run: make sensors-examples

      # Issue #40: promtool validates the /metrics surface - the exposition
      # format of the golden fixture, the alert rules file and its behaviour
      # test. It is a pinned release binary on purpose, never a go.mod
      # dependency (the dep budget has no room for client_golang). The same
      # version is pinned in the Makefile; keep the two in step.
      - name: install promtool
        run: |
          curl -sSL --fail -o /tmp/promtool.tgz \
            https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz
          tar -xzf /tmp/promtool.tgz -C /tmp prometheus-3.14.0.linux-amd64/promtool
          sudo install /tmp/prometheus-3.14.0.linux-amd64/promtool /usr/local/bin/promtool
          promtool --version

      - name: metrics exposition is valid Prometheus text
        run: make prom-check-metrics

      - name: alert rules parse
        run: make prom-check-rules

      - name: alert rules behave (JobStale fires at its SLA, not before)
        run: make prom-rules

      - name: go test -race
        run: make test

      # The sensor-cursor property test (issue #16) is a model-based crash sweep
      # over a real SQLite file. It runs under -race here with a bounded seed and
      # action count so it finishes deterministically in CI time. It is deliberately
      # a separate step from `go test -race` above, which would pay the race
      # detector's cost on a many-minute sweep. ~45 s of runner time.
      - name: sensor cursor property test
        run: make property

      # The gate runs without the race detector: it is where the throughput
      # floor is asserted, and a number measured under the detector would only
      # describe the detector. Roughly 15 s of runner time.
      - name: concurrency gate and throughput floor
        run: make gate

      # A job file is untrusted input and the parser is the surface that reads
      # it. Sixty seconds of fuzzing per pull request, over a corpus that is
      # seeded from internal/spec/testdata.
      - name: fuzz the job file parser
        run: make fuzz

      - name: build
        run: make build

      # Issue #47 acceptance: the binary must find Europe/Oslo inside a FROM
      # scratch image without /usr/share/zoneinfo and compute the next tick
      # from the embedded tzdata. Needs docker, which ubuntu runners have.
      - name: scratch container resolves Europe/Oslo
        run: make test-scratch

  # Gold standard fixtures are expectations, not code. A commit that edits one
  # must carry a FIXTURE-CHANGE: line with a reason (plan 04 section 8 point
  # 2). This needs history, so it runs in its own full checkout job instead of
  # the shallow verify job. `make fixture-change` is the local equivalent.
  fixture-change:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: fixture changes carry a FIXTURE-CHANGE reason
        run: scripts/check-fixture-change.sh "refs/remotes/origin/${{ github.base_ref }}" HEAD

  cross-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          # Not a supported platform for v1.0. It smoke tests that
          # Linux-specific code stays behind build tags.
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          # Caching is off here on purpose: this job shares a cache key with
          # verify, and the last writer wins. The verify cache is worth more.
          cache: false

      - name: cross build and assert cgo free
        run: scripts/cross-build.sh "${{ matrix.goos }}" "${{ matrix.goarch }}"

  # Issue #43: the release configuration is executed on every pull request,
  # because a broken .goreleaser.yaml must be caught before anyone tags, not
  # after. Snapshot mode runs every build, archive and checksum rule and
  # publishes nothing.
  release-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          # First run compiles the pinned GoReleaser through `go run`; later
          # runs come out of the build cache, like the other pinned tools.
          cache-dependency-path: go.mod

      - name: goreleaser snapshot builds and packages without publishing
        run: make release-snapshot
