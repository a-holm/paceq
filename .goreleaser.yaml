# The release pipeline (issue #43). A push of a v* tag builds one static binary
# per supported platform, archives it with the project documents, checksums
# everything and leaves a DRAFT GitHub release for [M5-09] to review and
# publish.
#
# Reproducibility facts baked in here: -trimpath keeps the build path out,
# mod_timestamp stamps archives from the commit instead of the clock, and the
# build date comes from .CommitDate so two builds of one tag are byte
# identical. The release workflow verifies that claim with a double-build gate;
# it fails the release when the hashes diverge (plan 08 §5).
#
# cosign signing and the CycloneDX SBOM are deliberately not here: they land
# with [M8-04] (https://github.com/a-holm/paceq/issues/76) at the 1.0 line,
# together with the documented verification instructions that make them more
# than theater.
version: 2

project_name: paceq

before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - id: paceq
    main: ./cmd/paceq
    binary: paceq
    # CGO_ENABLED=0 is not negotiable: the point of the pure-Go driver is a
    # static binary with no libc to link against. The cgo leak gate from
    # M0-02 (scripts/cross-build.sh) carries over unchanged.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=true
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/a-holm/paceq/internal/buildinfo.Version={{ .Version }}
      - -X github.com/a-holm/paceq/internal/buildinfo.Commit={{ .FullCommit }}
      # The commit date, never the wall clock: this is one half of why two
      # builds of one tag agree byte for byte.
      - -X github.com/a-holm/paceq/internal/buildinfo.Date={{ .CommitDate }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - SECURITY.md
      - SCOPE.md
      - deploy/paceq.service
      # Lands with [M5-06]; until that merge the entry matches nothing, which
      # GoReleaser tolerates for globs, so snapshots stay green either way.
      - deploy/*.yml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  # CHANGELOG.md is written by hand for humans (plan 09 §9.3); an autogenerated
  # commit dump is not a changelog.
  disable: true

release:
  # [M5-09] reviews and publishes; nothing here goes out unreviewed.
  draft: true
  prerelease: auto
  footer: |
    ## Verify your download

    ```
    sha256sum -c checksums.txt --ignore-missing
    ```

    One static binary: no runtime, no Docker, no package manager. See
    CHANGELOG.md for what is new and docs/guarantees.md for what is promised.
